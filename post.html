<!DOCTYPE html>
<html lang="en">
<head>



    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Quick Bird - Article Details</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Arial, sans-serif; }
        .navbar-custom { background-color: #1a252f; padding: 12px 0; }
        .navbar-custom .navbar-brand { color: #fff; font-weight: 700; font-size: 1.5rem; }
        .navbar-custom .nav-link { color: #dcdde1 !important; font-weight: 500; margin-right: 10px; }
        .navbar-custom .nav-link:hover { color: #fbc531 !important; }
        .btn-visit { background-color: #27ae60; color: #fff; font-weight: 600; padding: 12px 24px; border-radius: 8px; text-decoration: none; display: inline-block; }
        .btn-visit:hover { background-color: #219150; color: #fff; }
        footer { background-color: #1a252f; color: #a4b0be; padding: 40px 0 20px; }
        footer a { color: #a4b0be; text-decoration: none; }
        footer a:hover { color: #fbc531; }
    </style>


<!-- Favicon -->
<link rel="icon" type="image/png" href="/image/favicon.png">

    


    

<script src="scripts.js" async></script>

    
</head>
<body>

    <!-- Header / Nav (ஒரு முறை மட்டும் அமைத்தால் போதும்) -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">

                <img src="image/favicon.png" alt="Logo" width="80" height="80" class="d-inline-block align-text-top me-2">
                
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="topNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html"><i class="fa fa-home me-1"></i> Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Slot (இங்கே தான் உங்கள் கட்டுரை வந்து அமரும்) -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div id="content-slot" class="bg-white p-4 p-md-5 rounded shadow-sm">
                    <p class="text-center text-muted">Loading article details...</p>
                </div>

<!-- 🌟 அஃபிலியேட் டிஸ்க்ளைமரை இங்கே சேர்க்கவும் -->
                <div class="alert alert-secondary small text-muted mt-4 p-3 rounded border text-center">
                    <i class="fa-solid fa-circle-info me-1 text-warning"></i> 
                    <strong>Disclaimer:</strong> This site contains affiliate links. If you make a purchase through these links, we may earn a small commission at no extra cost to you.
                </div>
                <!-- 🌟 முடிவு பகுதி -->      
            
            </div>
        </div>
    </main>

    <!-- Footer (ஒரு முறை மட்டும் அமைத்தால் போதும்) -->
    <footer>
        <div class="container text-center small">
            <p class="mb-0">&copy; 2026 Quick Bird. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- கட்டுரையைத் தானாக உள்ளே இழுத்து வைக்கும் Script -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const params = new URLSearchParams(window.location.search);
            const articleId = params.get('id') || 'post1';

            // post1.html, post2.html போன்ற கோப்புகளை உள்ளே ஏற்றுகிறது
            fetch(`${articleId}.html`)
                .then(response => {
                    if (!response.ok) throw new Error('Article not found');
                    return response.text();
                })
                .then(data => {
                    document.getElementById('content-slot').innerHTML = data;
                })
                .catch(error => {
                    document.getElementById('content-slot').innerHTML = `
                        <div class="text-center py-5">
                            <h3 class="text-danger">Article Not Found</h3>
                            <p class="text-muted">The article you are looking for does not exist or has been moved.</p>
                            <a href="index.html" class="btn btn-primary mt-3">Back to Home</a>
                        </div>`;
                });
        });
    </script>
</body>
</html>
