    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Quick Bird - Article Details</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Arial, sans-serif; }
        
        /* Navbar & AliExpress Style Brand Design */
        .navbar-custom { background-color: #1a252f !important; padding: 10px 0 !important; }
        .navbar-custom .navbar-brand { color: #fff; font-weight: 700; font-size: 1.3rem; display: flex; align-items: center; text-decoration: none; }
        .navbar-custom .nav-link { color: #dcdde1 !important; font-weight: 500; margin-right: 10px; }
        .navbar-custom .nav-link:hover, .navbar-custom .nav-link.active { color: #fbc531 !important; }
        
        .btn-visit { background-color: #27ae60; color: #fff; font-weight: 600; padding: 12px 24px; border-radius: 8px; text-decoration: none; display: inline-block; }
        .btn-visit:hover { background-color: #219150; color: #fff; }
        footer { background-color: #1a252f; color: #a4b0be; padding: 40px 0 20px; }
        footer a { color: #a4b0be; text-decoration: none; }
        footer a:hover { color: #fbc531; }
    </style>

<!-- Favicon -->
<link rel="icon" type="image/png" href="image/favicon.png">

<script src="scripts.js" async></script>

</head>
<body>

    <!-- Header / Nav (AliExpress Style Logo + Quick Bird Name) -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="image/favicon.png" alt="Logo" style="width: 38px; height: 38px; object-fit: contain; margin-right: 8px;">
                <span>Quick <span style="color: #fbc531;">Bird</span></span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#topNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="topNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html"><i class="fa fa-home me-1"></i> Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Slot -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div id="content-slot" class="bg-white p-4 p-md-5 rounded shadow-sm">
                    <!-- Article Content -->
                </div>

                <!-- அஃபிலியேட் டிஸ்க்ளைமர் (ஆரம்பத்தில் மறைக்கப்பட்டிருக்கும்) -->
                <div id="affiliate-disclaimer" class="alert alert-secondary small text-muted mt-4 p-3 rounded border text-center" style="display: none;">
                    <i class="fa-solid fa-circle-info me-1 text-warning"></i> 
                    <strong>Disclaimer:</strong> This site contains affiliate links. If you make a purchase through these links, we may earn a small commission at no extra cost to you.
                </div>
            
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container text-center small">
            <p class="mb-0">&copy; 2026 Quick Bird. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ஆர்டிகள் உடனடியாக வந்து, படங்கள் வரிசையாக லோட் ஆன பிறகு டிஸ்களைமர் காட்டும் ஸ்கிரிப்ட் -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const params = new URLSearchParams(window.location.search);
            const articleId = params.get('id') || 'post1';

            const contentSlot = document.getElementById('content-slot');
            const disclaimerBox = document.getElementById('affiliate-disclaimer');
            
            fetch(`${articleId}.html`)
                .then(response => {
                    if (!response.ok) throw new Error('Article not found');
                    return response.text();
                })
                .then(data => {
                    contentSlot.innerHTML = data;

                    const articleImages = contentSlot.querySelectorAll('img');
                    
                    // படங்கள் இல்லையென்றால் உடனே டிஸ்களைமரைக் காட்டுவது
                    if (articleImages.length === 0) {
                        if (disclaimerBox) disclaimerBox.style.display = 'block';
                        return;
                    }

                    articleImages.forEach(img => {
                        img.setAttribute('data-original-src', img.src);
                        img.src = "image/favicon.png";
                        img.style.width = "50px";
                        img.style.height = "50px";
                        img.style.objectFit = "contain";
                        img.style.opacity = "0.4";
                        img.style.display = "block";
                        img.style.margin = "20px auto";
                    });

                    let currentIndex = 0;

                    function loadNextImage() {
                        if (currentIndex >= articleImages.length) {
                            // அனைத்துப் படங்களும் லோட் ஆன பின் டிஸ்களைமர் பாக்ஸ் வெளிப்படும்
                            if (disclaimerBox) disclaimerBox.style.display = 'block';
                            return;
                        }

                        const img = articleImages[currentIndex];
                        const originalSrc = img.getAttribute('data-original-src');

                        const tempImg = new Image();
                        tempImg.src = originalSrc;

                        tempImg.onload = function() {
                            img.src = originalSrc;
                            img.style.width = "100%";
                            img.style.height = "auto";
                            img.style.maxHeight = "450px";
                            img.style.objectFit = "contain";
                            img.style.opacity = "1";
                            img.style.margin = "0 auto";

                            currentIndex++;
                            loadNextImage();
                        };

                        tempImg.onerror = function() {
                            currentIndex++;
                            loadNextImage();
                        };
                    }

                    loadNextImage();
                })
                .catch(error => {
                    contentSlot.innerHTML = `
                        <div class="text-center py-5">
                            <h3 class="text-danger">Article Not Found</h3>
                            <p class="text-muted">The article you are looking for does not exist or has been moved.</p>
                            <a href="index.html" class="btn btn-primary mt-3">Back to Home</a>
                        </div>`;
                });
        });
    </script>
</body>
</html>
