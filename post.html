    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Arial, sans-serif; }

        /* ஆர்டிகல் தலைப்புகள் மற்றும் டேட் பகுதி */

        @media (max-width: 768px) {

            #content-slot { padding: 20px !important; }
            .related-card img { height: 80px !important; }
        }

<script src="scripts.js" async></script>

<body>

    <!-- Header / Nav -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="image/favicon.png" alt="Logo" style="width: 38px; height: 38px; object-fit: contain; margin-right: 8px;">
                <span>Quick <span style="color: #fbc531;">Bird</span></span>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#topNavbar" aria-controls="topNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="topNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html"><i class="fa fa-home me-1"></i> Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Slot -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div id="content-slot" class="bg-white p-4 p-md-5 rounded shadow-sm">
                    <!-- Article Content -->
                </div>

                <!-- AdSense In-Article Ad Slot -->
                <div class="my-4 text-center">
                    <ins class="adsbygoogle"
                         style="display:block; text-align:center;"
                         data-ad-layout="in-article"
                         data-ad-format="fluid"
                         data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                         data-ad-slot="YYYYYYYYYY"></ins>
                    <script>
                         (adsbygoogle = window.adsbygoogle || []).push({});
                    </script>
                </div>

                <!-- Related Posts Section -->
                <div id="related-posts-section" class="mt-5" style="display: none;">
                    <h4 class="fw-bold text-dark mb-3 border-start border-4 border-warning ps-3">Related Posts</h4>
                    <div class="row g-3" id="related-posts-container"></div>
                </div>

                <!-- More in Main Category Section -->
                <div id="category-posts-section" class="mt-5" style="display: none;">
                    <h4 class="fw-bold text-dark mb-3 border-start border-4 border-warning ps-3" id="category-section-title">More in Category</h4>
                    <div class="row g-3" id="category-posts-container"></div>
                </div>

                <!-- அஃபிலியேட் டிஸ்க்ளைமர் -->
                <div id="affiliate-disclaimer" class="alert alert-secondary small text-muted mt-4 p-3 rounded border text-center" style="display: none;">
                    <i class="fa-solid fa-circle-info me-1 text-warning"></i> 
                    <strong>Disclaimer:</strong> This site contains affiliate links. If you make a purchase through these links, we may earn a small commission at no extra cost to you.
                </div>
            
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container text-center small">
            <p class="mb-0">&copy; 2026 Quick Bird. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ஸ்கிரிப்ட்: படங்கள் அனைத்தும் லோகோ பிளேஸ்ஹோல்டருடன் சீராக லோட் ஆக -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const params = new URLSearchParams(window.location.search);
            const articleId = params.get('id') || 'post1';

            const contentSlot = document.getElementById('content-slot');
            const disclaimerBox = document.getElementById('affiliate-disclaimer');
            
            fetch(`${articleId}.html`)
                .then(response => {
                    if (!response.ok) throw new Error('Article not found');
                    return response.text();
                })
                .then(data => {
                    contentSlot.innerHTML = data;

                    // Fetch posts.json to load Related & Category posts
                    fetch('posts.json')
                        .then(res => res.json())
                        .then(posts => {
                            const currentPost = posts.find(p => p.id === articleId || p.link.includes(articleId));
                            if (currentPost) {
                                if (currentPost.title) {
                                    document.getElementById('page-title').innerText = currentPost.title + " - Quick Bird";
                                }

                                const subCat = currentPost.subcategory;
                                const mainCat = currentPost.category;

                                // 1. Sub-category Related Posts
                                const relatedContainer = document.getElementById('related-posts-container');
                                const relatedSection = document.getElementById('related-posts-section');
                                const relatedItems = posts.filter(p => p.subcategory === subCat && p.id !== currentPost.id);

                                if (relatedItems.length > 0) {
                                    let html = '';
                                    relatedItems.forEach(p => {
                                        html += `
                                            <div class="col-6 col-md-3">
                                                <div class="related-card p-2 h-100 d-flex flex-column justify-content-between">
                                                    <a href="post.html?id=${p.id}" class="text-decoration-none">
                                                        <img src="image/favicon.png" data-original-src="${p.image}" class="w-100 rounded mb-2 delayed-grid-img" style="height: 100px; object-fit: contain; opacity: 0.4;" alt="${p.title}">
                                                        <h6 class="text-dark small fw-bold text-truncate" title="${p.title}">${p.title}</h6>
                                                    </a>
                                                </div>
                                            </div>
                                        `;
                                    });
                                    relatedContainer.innerHTML = html;
                                    relatedSection.style.display = 'block';
                                }

                                // 2. Main Category Posts
                                const catContainer = document.getElementById('category-posts-container');
                                const catSection = document.getElementById('category-posts-section');
                                document.getElementById('category-section-title').innerText = `More in ${mainCat || 'Category'}`;
                                const catItems = posts.filter(p => p.category === mainCat && p.id !== currentPost.id);

                                if (catItems.length > 0) {
                                    let html = '';
                                    catItems.forEach(p => {
                                        html += `
                                            <div class="col-6 col-md-3">
                                                <div class="related-card p-2 h-100 d-flex flex-column justify-content-between">
                                                    <a href="post.html?id=${p.id}" class="text-decoration-none">
                                                        <img src="image/favicon.png" data-original-src="${p.image}" class="w-100 rounded mb-2 delayed-grid-img" style="height: 100px; object-fit: contain; opacity: 0.4;" alt="${p.title}">
                                                        <h6 class="text-dark small fw-bold text-truncate" title="${p.title}">${p.title}</h6>
                                                    </a>
                                                </div>
                                            </div>
                                        `;
                                    });
                                    catContainer.innerHTML = html;
                                    catSection.style.display = 'block';
                                }

                                // ரிலேட்டட் மற்றும் கேட்டகிரி கார்டுகளில் உள்ள படங்களையும் வரிசையாக லோட் செய்யத் தொடங்குதல்
                                loadGridImages();
                            }
                        })
                        .catch(err => console.log('Error loading posts data for relations:', err));

                    // பிரதான ஆர்டிகல் படங்களை தயார் செய்தல்
                    const articleImages = contentSlot.querySelectorAll('img');
                    
                    if (articleImages.length === 0) {
                        checkAllContentLoaded();
                    } else {
                        articleImages.forEach(img => {
                            img.setAttribute('data-original-src', img.src);
                            img.src = "image/favicon.png";
                            img.style.width = "50px";
                            img.style.height = "50px";
                            img.style.objectFit = "contain";
                            img.style.opacity = "0.4";
                            img.style.display = "block";
                            img.style.margin = "20px auto";
                        });
                        loadArticleImages(articleImages);
                    }
                })
                .catch(error => {
                    contentSlot.innerHTML = `
                        <div class="text-center py-5">
                            <h3 class="text-danger">Article Not Found</h3>
                            <p class="text-muted">The article you are looking for does not exist or has been moved.</p>
                            <a href="index.html" class="btn btn-primary mt-3">Back to Home</a>
                        </div>`;
                });

            let articleImagesLoaded = false;
            let gridImagesLoaded = false;

            function checkAllContentLoaded() {
                if (articleImagesLoaded && gridImagesLoaded) {
                    if (disclaimerBox) disclaimerBox.style.display = 'block';
                }
            }

            // ஆர்டிகல் படங்களை வரிசையாக லோட் செய்யும் ஃபங்ஷன்
            function loadArticleImages(images) {
                let currentIndex = 0;

                function loadNext() {
                    if (currentIndex >= images.length) {
                        articleImagesLoaded = true;
                        checkAllContentLoaded();
                        return;
                    }

                    const img = images[currentIndex];
                    const originalSrc = img.getAttribute('data-original-src');
                    const tempImg = new Image();
                    tempImg.src = originalSrc;

                    tempImg.onload = function() {
                        img.src = originalSrc;
                        img.style.width = "100%";
                        img.style.height = "auto";
                        img.style.maxHeight = "450px";
                        img.style.objectFit = "contain";
                        img.style.opacity = "1";
                        img.style.margin = "0 auto";

                        currentIndex++;
                        loadNext();
                    };

                    tempImg.onerror = function() {
                        currentIndex++;
                        loadNext();
                    };
                }

                loadNext();
            }

            // கீழே உள்ள ரிலேட்டட்/கேட்டகிரி கார்டு படங்களை வரிசையாக லோட் செய்யும் ஃபங்ஷன்
            function loadGridImages() {
                const gridImages = document.querySelectorAll('.delayed-grid-img');
                if (gridImages.length === 0) {
                    gridImagesLoaded = true;
                    checkAllContentLoaded();
                    return;
                }

                let currentGridIndex = 0;

                function loadNextGrid() {
                    if (currentGridIndex >= gridImages.length) {
                        gridImagesLoaded = true;
                        checkAllContentLoaded();
                        return;
                    }

                    const img = gridImages[currentGridIndex];
                    const originalSrc = img.getAttribute('data-original-src');
                    const tempImg = new Image();
                    tempImg.src = originalSrc;

                    tempImg.onload = function() {
                        img.src = originalSrc;
                        img.style.opacity = "1";

                        currentGridIndex++;
                        loadNextGrid();
                    };

                    tempImg.onerror = function() {
                        currentGridIndex++;
                        loadNextGrid();
                    };
                }

                loadNextGrid();
            }
        });
    </script>
</body>
</html>
