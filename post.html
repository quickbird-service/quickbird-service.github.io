<body>

    <!-- Main Content Slot -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- கட்டுரையைத் தானாக உள்ளே இழுத்து டெமு ஸ்டைல் பட லோடிங்குடன் காட்டும் முழுமையான Script -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const params = new URLSearchParams(window.location.search);
            const articleId = params.get('id') || 'post1';

            const contentSlot = document.getElementById('content-slot');
            
            // லோடிங் ஸ்பின்னர் காட்டுவது
            contentSlot.innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner-border text-warning" role="status" style="width: 3rem; height: 3rem;">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="text-muted mt-3">Loading article details...</p>
                </div>
            `;

            // post1.html, post2.html போன்ற கோப்புகளை உள்ளே ஏற்றுவது
            fetch(`${articleId}.html`)
                .then(response => {
                    if (!response.ok) throw new Error('Article not found');
                    return response.text();
                })
                .then(data => {
                    contentSlot.innerHTML = data;

                    // கட்டுரைக் கோப்பு வந்தடைந்த பிறகு, அதிலுள்ள படங்களைப் பாதியாக வராமல் டெமு ஸ்டைலில் ஒரே அடியாக லோட் செய்ய
                    const articleImages = contentSlot.querySelectorAll('img');
                    
                    articleImages.forEach(img => {
                        const originalSrc = img.getAttribute('src');
                        if (!originalSrc) return;

                        // 1. ஆரம்பத்தில் படம் முழுமையாக வரும் வரை உங்கள் தளத்தின் லோகோவைக் காட்டுவது
                        img.src = "image/favicon.png";
                        img.style.width = "50px";
                        img.style.height = "50px";
                        img.style.objectFit = "contain";
                        img.style.opacity = "0.4";
                        img.style.display = "block";
                        img.style.margin = "20px auto";

                        // 2. பின்னணியில் உண்மையான படத்தை முழுமையாக டவுன்லோட் செய்தல்
                        const tempImg = new Image();
                        tempImg.src = originalSrc;

                        tempImg.onload = function() {
                            // 3. படம் முழுமையாகத் தயாரானதும் ஒரே அடியாக ஒரிஜினல் படம் மாறுவது
                            img.src = originalSrc;
                            img.style.width = "100%";
                            img.style.height = "auto";
                            img.style.maxHeight = "450px";
                            img.style.objectFit = "contain";
                            img.style.opacity = "1";
                            img.style.margin = "0 auto";
                        };
                    });
                })
                .catch(error => {
                    contentSlot.innerHTML = `
                        <div class="text-center py-5">
                            <h3 class="text-danger">Article Not Found</h3>
                            <p class="text-muted">The article you are looking for does not exist or has been moved.</p>
                            <a href="index.html" class="btn btn-primary mt-3">Back to Home</a>
                        </div>`;
                });
        });
    </script>
