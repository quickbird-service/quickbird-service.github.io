name: Auto Indexing

on:
  push:
    branches:
      - main

jobs:
  index-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-api-python-client oauth2client

      - name: Run Indexing Script
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python - << 'EOF'
          import os
          import subprocess
          import json
          from googleapiclient.discovery import build
          from oauth2client.service_account import ServiceAccountCredentials

          # 1. Credentials Setup
          creds_json = os.environ.get('GOOGLE_CREDENTIALS')
          if not creds_json:
              print("Error: GOOGLE_CREDENTIALS secret not found.")
              exit(1)

          creds_dict = json.loads(creds_json)
          SCOPES = ["https://www.googleapis.com/auth/indexing"]
          credentials = ServiceAccountCredentials.from_json_keyfile_dict(creds_dict, SCOPES)
          service = build('indexing', 'v3', credentials=credentials)

          # 2. Get modified HTML files from the latest push
          result = subprocess.run(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], stdout=subprocess.PIPE, text=True)
          changed_files = result.stdout.splitlines()

          base_domain = "https://quickbird-service.github.io"

          for file in changed_files:
              # Only process HTML files, skipping index.html or post.html itself if modified
              if file.endswith('.html') and file != 'index.html' and file != 'post.html':
                  # Remove .html extension from the file path
                  path_without_ext = file[:-5]
                  
                  # Construct URL in the format: /post.html?id=folder/path
                  target_url = f"{base_domain}/post.html?id={path_without_ext}"
                  
                  print(f"Submitting URL to Google: {target_url}")

                  body = {
                      "url": target_url,
                      "type": "URL_UPDATED"
                  }

                  try:
                      response = service.urlNotifications().publish(body=body).execute()
                      print(f"Successfully notified: {response}")
                  except Exception as e:
                      print(f"Failed to index {target_url}: {e}")
          EOF
