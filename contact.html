<!DOCTYPE html>
<html lang="en">
<head>

    
<!-- Favicon -->
<link rel="icon" type="image/png" href="/image/favicon.png">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Quick Bird</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Arial, sans-serif; }
        .top-header { background-color: #131921; color: #fff; padding: 15px 0; }
        .navbar-main { background-color: #232f3e; }
        .navbar-main .nav-link { color: #fff !important; font-weight: 500; margin-right: 15px; }
        .content-card { background: #fff; border-radius: 8px; padding: 30px; border: 1px solid #e1e4e8; margin-top: 30px; max-width: 700px; }
    </style>


    <script src="scripts.js" async></script>

</head>
<body>

    <header class="top-header">
        <div class="container">
            <a class="navbar-brand text-white fw-bold fs-4" href="index.html">Quick Bird</a>
        </div>
    </header>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-main">
        <div class="container">
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contact Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="privacy.html">Privacy Policy</a></li>
                    <li class="nav-item"><a class="nav-link" href="terms.html">Terms and Conditions</a></li>
                    <li class="nav-item"><a class="nav-link" href="disclaimer.html">Disclaimer</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="content-card shadow-sm mx-auto">
            <h2 class="fw-bold mb-3">Contact Us</h2>
            <p class="text-muted">Have a question or feedback? Reach out to us using the form below or via email.</p>
            <hr class="mb-4">
            <form>
                <div class="mb-3">
                    <label class="form-label fw-bold">Full Name</label>
                    <input type="text" class="form-control" placeholder="Enter your name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Email Address</label>
                    <input type="email" class="form-control" placeholder="name@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Subject</label>
                    <input type="text" class="form-control" placeholder="Subject" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Message</label>
                    <textarea class="form-control" rows="5" placeholder="Type your message here..." required></textarea>
                </div>
                <button type="submit" class="btn btn-warning fw-bold px-4">Send Message</button>
                <a href="index.html" class="btn btn-link text-decoration-none ms-2">Back to Home</a>
            </form>
        </div>
    </div>

    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-1">&copy; 2026 Quick Bird. All Rights Reserved.</p>
        </div>
    </footer>

</body>
</html>
