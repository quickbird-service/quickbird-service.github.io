<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="image/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - Quick Bird</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Arial, sans-serif; }
        .navbar-custom { background-color: #1a252f !important; padding: 12px 0 16px 0 !important; }
        .navbar-custom .navbar-brand { color: #fff; font-weight: 700; font-size: 1.3rem; display: flex; align-items: center; text-decoration: none; }
        .navbar-custom .nav-link { color: #dcdde1 !important; font-weight: 500; margin-right: 10px; }
        .navbar-custom .nav-link:hover, .navbar-custom .nav-link.active { color: #fbc531 !important; }
        .dropdown-menu-dark { background-color: #2c3e50; border: none; }
        .dropdown-item { color: #dcdde1; padding: 8px 20px; }
        .dropdown-item:hover { background-color: #34495e; color: #fbc531; }
        .post-card { border: none; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); background: #ffffff; }
        footer { background-color: #1a252f; color: #a4b0be; padding: 40px 0 20px; }
        footer a { color: #a4b0be; text-decoration: none; }
        footer a:hover { color: #fbc531; }
    </style>
</head>
<body>

    <!-- Main Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top shadow-sm">
        <div class="container">
            <div class="w-100">
                <div class="d-flex justify-content-between align-items-center">
                    <a class="navbar-brand" href="index.html">
                        <img src="image/favicon.png" alt="Logo" style="width: 38px; height: 38px; object-fit: contain; margin-right: 8px;">
                        <span>Quick <span style="color: #fbc531;">Bird</span></span>
                    </a>
                    <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#topNavbar" aria-controls="topNavbar" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>

                <div class="collapse navbar-collapse mt-2" id="topNavbar">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html"><i class="fa fa-home me-1"></i> Home</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="categoriesDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                Categories
                            </a>
                            <ul class="dropdown-menu dropdown-menu-dark shadow p-2" id="dynamic-categories" aria-labelledby="categoriesDropdown" style="min-width: 260px; max-height: 400px; overflow-y: auto;">
                                <li><span class="dropdown-item text-muted">Loading...</span></li>
                            </ul>
                        </li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                        <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
                    </ul>
                </div>

            </div>
        </div>
    </nav>

    <!-- Search Results Content -->
    <main class="container my-4">
        
        <!-- பெரிய சர்ச் பாக்ஸ் பகுதி -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow-sm border-0 p-3 bg-white" style="border-radius: 12px;">
                    <form class="d-flex" action="search.html" method="GET">
                        <div class="input-group input-group-lg">
                            <input id="search-input-box" name="q" class="form-control border py-3" type="search" placeholder="Search products again..." aria-label="Search" required style="font-size: 1rem;">
                            <button class="btn btn-warning px-4 text-dark fw-bold" type="submit">
                                <i class="fa fa-search me-1"></i> Search
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-12">
                <h4 id="search-heading" class="fw-bold border-start border-4 border-warning ps-3 text-dark">Search Results</h4>
            </div>
        </div>

        <!-- Posts Results Container -->
        <div class="row g-4" id="posts-container">
            <!-- ரிசல்ட்டுகள் இங்கே வரும் -->
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="row text-center text-md-start">
                <div class="col-md-6 mb-3">
                    <h5 class="text-white">Quick <span style="color: #fbc531;">Bird</span></h5>
                    <p class="small">Find the Best Value and Shop Smart with Our Trusted Product Guides.</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <p class="small mb-0">&copy; 2026 Quick Bird. All Rights Reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Search & Menu Script with Temu Style Image Loading -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const searchQuery = urlParams.get('q') ? urlParams.get('q').trim() : "";
            const searchCategory = urlParams.get('category') ? urlParams.get('category').trim() : "";

            const searchInputBox = document.getElementById("search-input-box");
            if (searchInputBox && searchQuery) {
                searchInputBox.value = searchQuery;
            }

            const searchHeading = document.getElementById("search-heading");
            if (searchHeading) {
                if (searchQuery) {
                    searchHeading.innerText = `Search Results for: "${searchQuery}"`;
                } else if (searchCategory) {
                    searchHeading.innerText = `Category: "${searchCategory}"`;
                }
            }

            const container = document.getElementById("posts-container");

            // டெமு ஸ்டைல் வரிசை முறை பட லோடிங் (Sequential Temu Style Loading)
            function loadImagesSequentially(scopeElement) {
                const images = scopeElement.querySelectorAll('.post-img');
                if (images.length === 0) return;

                images.forEach(img => {
                    const originalSrc = img.getAttribute('data-original-src');
                    if (!originalSrc) return;
                    img.src = "image/favicon.png";
                    img.style.width = "40px";
                    img.style.height = "40px";
                    img.style.objectFit = "contain";
                    img.style.opacity = "0.4";
                    img.style.margin = "auto";
                });

                let imgIndex = 0;

                function loadNext() {
                    if (imgIndex >= images.length) return;

                    const img = images[imgIndex];
                    const originalSrc = img.getAttribute('data-original-src');
                    if (!originalSrc) {
                        imgIndex++;
                        loadNext();
                        return;
                    }

                    const tempImg = new Image();
                    tempImg.src = originalSrc;

                    tempImg.onload = function() {
                        img.src = originalSrc;
                        img.style.width = "100%";
                        img.style.height = "100%";
                        img.style.objectFit = "contain";
                        img.style.opacity = "1";
                        imgIndex++;
                        loadNext();
                    };

                    tempImg.onerror = function() {
                        imgIndex++;
                        loadNext();
                    };
                }

                loadNext();
            }

            fetch("posts.json")
                .then(response => response.json())
                .then(posts => {
                    // 1. கேட்டகரி மெனுவை உருவாக்குதல்
                    const dropdownContainer = document.getElementById("dynamic-categories");
                    if (dropdownContainer) {
                        dropdownContainer.innerHTML = "";
                        const categoriesMap = {};
                        posts.forEach(post => {
                            const catName = post.category || "General";
                            const subCatName = post.subcategory || "Others";
                            if (!categoriesMap[catName]) {
                                categoriesMap[catName] = new Set();
                            }
                            categoriesMap[catName].add(subCatName);
                        });

                        let catIndex = 0;
                        for (const [catName, subCategories] of Object.entries(categoriesMap)) {
                            catIndex++;
                            const mainCollapseId = "searchCatCollapse" + catIndex;
                            const catLi = document.createElement("li");
                            catLi.className = "px-2 mb-2";
                            
                            let subLinksHTML = "";
                            subCategories.forEach(subCat => {
                                subLinksHTML += `<a class="dropdown-item py-2 ps-4 text-light small text-wrap" href="search.html?category=${encodeURIComponent(subCat)}" style="background-color: #212f3d; margin-bottom: 2px; border-radius: 4px;">— ${subCat}</a>`;
                            });

                            catLi.innerHTML = `
                                <div class="d-flex justify-content-between align-items-center text-warning fw-bold px-3 py-2 rounded shadow-sm" style="background-color: #2c3e50; cursor: pointer;" onclick="const el = document.getElementById('${mainCollapseId}'); el.style.display = el.style.display === 'none' ? 'block' : 'none';">
                                    <span>${catName}</span>
                                    <i class="fa fa-chevron-down small"></i>
                                </div>
                                <div class="ps-2 mt-1" id="${mainCollapseId}" style="display: none;">
                                    ${subLinksHTML}
                                </div>
                            `;
                            dropdownContainer.appendChild(catLi);
                        }

                        dropdownContainer.addEventListener('click', function(e) {
                            e.stopPropagation();
                        });
                    }

                    // 2. தேடல் முடிவுகளை வடிகட்டுதல்
                    let filteredPosts = posts;
                    if (searchQuery) {
                        const queryLower = searchQuery.toLowerCase();
                        filteredPosts = posts.filter(post => 
                            (post.title && post.title.toLowerCase().includes(queryLower)) ||
                            (post.category && post.category.toLowerCase().includes(queryLower)) ||
                            (post.subcategory && post.subcategory.toLowerCase().includes(queryLower))
                        );
                    } else if (searchCategory) {
                        const catLower = searchCategory.toLowerCase();
                        filteredPosts = posts.filter(post => 
                            (post.subcategory && post.subcategory.toLowerCase() === catLower) ||
                            (post.category && post.category.toLowerCase() === catLower)
                        );
                    }

                    // 3. முடிவுகளை ஸ்கிரீனில் காட்டுவது (Temu Style Image Loading உடன்)
                    if (container) {
                        container.innerHTML = "";
                        if (filteredPosts.length === 0) {
                            container.innerHTML = `<div class="col-12 text-center py-5 text-muted">No posts found matching your search.</div>`;
                            return;
                        }

                        let html = "";
                        filteredPosts.forEach(post => {
                            html += `
                                <div class="col-6 col-md-4 mb-3">
                                    <div class="card post-card h-100 shadow-sm border-0" style="border-radius: 8px;">
                                        <div class="post-img-wrapper" style="height: 150px; background-color: #ffffff; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; border-top-left-radius: 8px; border-top-right-radius: 8px; padding: 6px;">
                                            <a href="${post.link}" class="w-100 h-100 d-flex align-items: center justify-content: center text-decoration-none">
                                                <img src="" data-original-src="${post.image}" class="post-img" alt="${post.title}" style="width: 100%; height: 100%; object-fit: contain;">
                                            </a>
                                        </div>
                                        <div class="card-body p-2 d-flex flex-column justify-content-between">
                                            <h2 class="post-title" style="font-size: 0.9rem; line-height: 1.3; margin-bottom: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                                                <a href="${post.link}" class="text-decoration-none text-dark">${post.title}</a>
                                            </h2>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                        container.innerHTML = html;

                        // ரிசல்ட் பக்கத்திலும் டெமு ஸ்டைல் லோடிங்கை இயக்குவது
                        loadImagesSequentially(container);
                    }
                })
                .catch(error => console.error("Error loading search results:", error));
        });
    </script>
</body>
</html>
